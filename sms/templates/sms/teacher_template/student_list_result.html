<div class="card shadow-sm border-0 p-3">
    <h6 class="fw-bold mb-3">Student List & Marks Entry</h6>
    <div class="table-responsive">
        <table class="table table-hover">
            <thead>
                <tr>
                    <th>ID</th>
                    <th>Name</th>
                    <th>Assignment Marks</th>
                    <th>Exam Marks</th>
                </tr>
            </thead>
            <tbody>
                {% for student in students %}
                <tr>
                    <td>{{ student.id }}</td>
                    <td>{{ student.user.get_full_name }}</td>
                    <td>
                        <input type="number" class="form-control" name="assignment_marks[]"
                            placeholder="Enter Assignment Marks" max="100">
                        <input type="hidden" name="student_ids[]" value="{{ student.id }}">
                    </td>
                    <td>
                        <input type="number" class="form-control" name="exam_marks[]" placeholder="Enter Exam Marks"
                            max="100">
                    </td>
                </tr>
                {% empty %}
                <tr>
                    <td colspan="4" class="text-center">No students found in this course</td>
                </tr>
                {% endfor %}
            </tbody>
        </table>
    </div>
    {% if students %}
    <button type="button" class="btn btn-success w-100 mt-3" id="save_result">Save Results</button>
    {% endif %}
</div>
