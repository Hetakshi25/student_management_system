<!DOCTYPE html>
{% load static %}
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SMS Portal | Secure Access</title>
    <!-- External Resources -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link
        href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;600;800&family=Inter:wght@300;400;600&display=swap"
        rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

    <style>
        :root {
            --primary: #4d61fc;
            --primary-glow: rgba(77, 97, 252, 0.25);
        }

        * { box-sizing: border-box; margin: 0; padding: 0; }

        body {
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            font-family: 'Plus Jakarta Sans', sans-serif;
            position: relative;
            overflow: hidden;
        }

        /* Full-screen university background */
        .bg-scene {
            position: fixed;
            inset: 0;
            background: url("{% static 'images/university.webp' %}") no-repeat center center / cover;
            z-index: 0;
        }

        /* Dark overlay so text stays readable */
        .bg-scene::after {
            content: '';
            position: absolute;
            inset: 0;
            background: linear-gradient(135deg, rgba(10,15,40,0.72) 0%, rgba(30,40,90,0.60) 100%);
        }

        /* Centered card */
        .login-card {
            position: relative;
            z-index: 1;
            width: 100%;
            max-width: 440px;
            margin: 20px;
            background: #ffffff;
            border-radius: 20px;
            box-shadow: 0 24px 64px rgba(0,0,0,0.35);
            padding: 44px 40px 40px;
        }

        /* Logo + title */
        .login-header {
            text-align: center;
            margin-bottom: 32px;
        }

        .login-header img {
            height: 56px;
            margin-bottom: 14px;
        }

        .login-header h2 {
            font-size: 1.45rem;
            font-weight: 800;
            color: #0f172a;
            letter-spacing: -0.4px;
            margin-bottom: 4px;
        }

        .login-header p {
            font-size: 0.875rem;
            color: #64748b;
        }

        /* Divider */
        .login-divider {
            border: none;
            border-top: 1px solid #e2e8f0;
            margin-bottom: 28px;
        }

        .form-label {
            display: block;
            font-weight: 600;
            font-size: 0.78rem;
            text-transform: uppercase;
            letter-spacing: 0.8px;
            color: #475569;
            margin-bottom: 6px;
        }

        .input-wrapper {
            position: relative;
            margin-bottom: 18px;
        }

        .input-wrapper .input-icon {
            position: absolute;
            left: 15px;
            top: 50%;
            transform: translateY(-50%);
            color: #64748b;
            font-size: 0.95rem;
            pointer-events: none;
            z-index: 2;
        }

        .toggle-password {
            position: absolute;
            right: 15px;
            top: 50%;
            transform: translateY(-50%);
            color: #64748b;
            font-size: 0.95rem;
            cursor: pointer;
            z-index: 2;
            transition: color 0.2s;
            user-select: none;
        }

        .toggle-password:hover { color: var(--primary); }

        .custom-input {
            width: 100%;
            padding: 12px 42px 12px 42px;
            background: #f8fafc;
            border: 1.5px solid #e2e8f0;
            border-radius: 10px;
            color: #0f172a;
            font-size: 0.95rem;
            font-family: inherit;
            transition: border-color 0.2s, box-shadow 0.2s, background 0.2s;
        }

        .custom-input::placeholder { color: #94a3b8; }

        .custom-input:focus {
            outline: none;
            border-color: var(--primary);
            background: #fff;
            box-shadow: 0 0 0 4px var(--primary-glow);
        }

        .custom-input:focus + .input-icon { color: var(--primary); }

        .login-button {
            width: 100%;
            padding: 13px;
            margin-top: 6px;
            background: var(--primary);
            color: #fff;
            border: none;
            border-radius: 10px;
            font-weight: 700;
            font-size: 0.95rem;
            font-family: inherit;
            cursor: pointer;
            transition: background 0.2s, box-shadow 0.2s, transform 0.1s;
            box-shadow: 0 4px 14px var(--primary-glow);
        }

        .login-button:hover {
            background: #3b4ad9;
            transform: translateY(-1px);
            box-shadow: 0 8px 20px var(--primary-glow);
        }

        .login-button:active { transform: translateY(0); }

        /* University badge at bottom of card */
        .uni-badge {
            text-align: center;
            margin-top: 24px;
            font-size: 0.75rem;
            color: #94a3b8;
        }

        .uni-badge span {
            display: inline-block;
            background: #f1f5f9;
            border: 1px solid #e2e8f0;
            border-radius: 20px;
            padding: 5px 14px;
        }

        .custom-alert {
            background: #fef2f2;
            border: 1px solid #fecaca;
            color: #dc2626;
            padding: 11px 14px;
            border-radius: 10px;
            font-size: 0.85rem;
            margin-top: 16px;
            animation: slideUp 0.3s ease-out;
        }

        @keyframes slideUp {
            from { opacity: 0; transform: translateY(8px); }
            to   { opacity: 1; transform: translateY(0); }
        }

        @media (max-width: 480px) {
            .login-card { padding: 32px 24px 28px; }
        }
    </style>
</head>

<body>
    <div class="bg-scene"></div>

    <div class="login-card">
        <div class="login-header">
            <img src="{% static 'images/logo.png' %}" alt="Logo">
            <h2>Student Management System</h2>
            <p>Institutional Portal &mdash; Authorized Access Only</p>
        </div>

        <hr class="login-divider">

        <form action="{% url 'do_login' %}" method="post">
            {% csrf_token %}

            <label class="form-label">Username / Email</label>
            <div class="input-wrapper">
                <input type="text" name="username" class="custom-input" placeholder="Enter your username or email" required>
                <i class="fas fa-user input-icon"></i>
            </div>

            <label class="form-label">Password</label>
            <div class="input-wrapper">
                <input type="password" name="password" id="passwordInput" class="custom-input" placeholder="Enter your password" required>
                <i class="fas fa-lock input-icon"></i>
                <i class="fas fa-eye toggle-password" id="togglePassword"></i>
            </div>

            <button type="submit" class="login-button">
                <i class="fas fa-sign-in-alt me-2"></i> Sign In
            </button>
        </form>

        {% if messages %}
        {% for message in messages %}
        <div class="custom-alert">
            <i class="fas fa-exclamation-circle me-2"></i> {{ message }}
        </div>
        {% endfor %}
        {% endif %}

        <div class="uni-badge">
            <span><i class="fas fa-university me-1"></i> Secure Institutional Portal</span>
        </div>
    </div>
    <script>
        document.getElementById('togglePassword').addEventListener('click', function () {
            const input = document.getElementById('passwordInput');
            const isPassword = input.type === 'password';
            input.type = isPassword ? 'text' : 'password';
            this.classList.toggle('fa-eye', !isPassword);
            this.classList.toggle('fa-eye-slash', isPassword);
        });
    </script>
</body>

</html>
