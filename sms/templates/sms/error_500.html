<!DOCTYPE html>
{% load static %}
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>500 - Server Error | Yash SMS</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        body {
            background: #050a18;
            color: white;
            height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            font-family: 'Plus Jakarta Sans', sans-serif;
            overflow: hidden;
        }
        .error-container {
            text-align: center;
            background: rgba(255, 255, 255, 0.05);
            backdrop-filter: blur(20px);
            padding: 60px;
            border-radius: 40px;
            border: 1px solid rgba(255, 255, 255, 0.1);
            max-width: 600px;
            box-shadow: 0 40px 100px -20px rgba(0,0,0,0.8);
        }
        h1 {
            font-size: 10rem;
            font-weight: 800;
            margin: 0;
            background: linear-gradient(45deg, #f87171, #ef4444);
            -webkit-background-clip: text;
            background-clip: text;
            -webkit-text-fill-color: transparent;
            line-height: 1;
        }
        h2 { font-weight: 700; margin-bottom: 20px; }
        p { color: rgba(255, 255, 255, 0.6); margin-bottom: 40px; font-size: 1.1rem; }
        .btn-home {
            background: #ef4444;
            color: white;
            padding: 15px 40px;
            border-radius: 15px;
            font-weight: 700;
            text-decoration: none;
            transition: all 0.3s;
            display: inline-block;
            box-shadow: 0 10px 30px rgba(239, 68, 68, 0.4);
        }
        .btn-home:hover {
            transform: translateY(-5px);
            background: #dc2626;
            box-shadow: 0 15px 40px rgba(239, 68, 68, 0.5);
        }
    </style>
</head>
<body>
    <div class="error-container">
        <h1>500</h1>
        <h2>Critical Core Exception</h2>
        <p>The system encountered an unexpected bottleneck. Our technicians have been alerted. Please try again later.</p>
        <a href="{% url 'login_page' %}" class="btn-home">
            <i class="fas fa-home me-2"></i> Return to Portal
        </a>
    </div>
</body>
</html>
